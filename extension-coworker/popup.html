<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tailor Studio — Co-worker</title>
  <style>
    :root { color-scheme: light; }
    html, body { margin: 0; padding: 0; font: 13px/1.4 -apple-system, system-ui, sans-serif; color: #1f2937; }
    body { width: 320px; padding: 12px 14px 14px; background: #fff; }
    h1 { font-size: 14px; margin: 0 0 12px; color: #111827; display: flex; align-items: center; gap: 8px; }
    h1 .role { background: linear-gradient(135deg,#a78bfa,#7c3aed); color: #fff; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 99px; letter-spacing: .04em; }
    label.field { display: block; font-size: 11px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: .04em; margin-top: 10px; }
    select, input[type=text] { width: 100%; padding: 6px 8px; font-size: 13px; border: 1px solid #e5e7eb; border-radius: 5px; margin-top: 4px; }
    button { font: inherit; cursor: pointer; }
    button.primary { width: 100%; background: linear-gradient(135deg,#6366f1,#4f46e5); color: #fff; border: 0; padding: 10px; font-weight: 700; border-radius: 6px; margin-top: 14px; box-shadow: 0 2px 6px rgba(79,70,229,.25); }
    button.primary:disabled { opacity: .5; cursor: default; box-shadow: none; }
    button.link { background: none; border: 0; color: #4f46e5; font-size: 11px; padding: 2px 0; margin-top: 4px; }
    #status { font-size: 12px; min-height: 18px; margin-top: 10px; text-align: center; }
    .err { color: #b91c1c; }
    .ok  { color: #15803d; }
    .help { font-size: 11px; color: #9ca3af; margin-top: 4px; line-height: 1.35; }
  </style>
</head>
<body>
  <h1>Tailor Studio <span class="role">Co-worker</span></h1>

  <label class="field">Main profile (used by widget + draft)
    <select id="main-profile">
      <option value="">— pick one —</option>
    </select>
  </label>
  <p class="help">When you open a job page, the widget auto-downloads this profile's tailored resume. On any ATS form, the bottom-left "✨ Draft" button generates answers for required essay questions.</p>

  <button class="link" id="settings" type="button">Server URL…</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
